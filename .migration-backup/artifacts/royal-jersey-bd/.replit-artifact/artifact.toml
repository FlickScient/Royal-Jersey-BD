kind = "web"
previewPath = "/"
title = "Royal Jersey BD"
version = "1.0.0"
id = "artifacts/royal-jersey-bd"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22662

[services.development]
run = "pnpm --filter @workspace/royal-jersey-bd run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/royal-jersey-bd", "run", "build" ]
publicDir = "artifacts/royal-jersey-bd/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22662"
BASE_PATH = "/"
