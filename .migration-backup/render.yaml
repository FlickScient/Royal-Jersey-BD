services:
  - type: web
    name: royal-jersey-bd
    runtime: node
    plan: free
    buildCommand: pnpm install && pnpm --filter @workspace/db push-force && BASE_PATH=/ VITE_CLERK_PUBLISHABLE_KEY=$CLERK_PUBLISHABLE_KEY VITE_CLERK_PROXY_URL=https://royaljerseybd.onrender.com/api/__clerk pnpm --filter @workspace/royal-jersey-bd run build && pnpm --filter @workspace/api-server run build
    startCommand: node artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
      - key: FRONTEND_DIST
        value: ./artifacts/royal-jersey-bd/dist/public
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: VITE_CLERK_PROXY_URL
        value: https://royaljerseybd.onrender.com/api/__clerk
